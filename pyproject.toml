[tool.poetry]
name = "silver-bullet-ml-bmad"
version = "0.1.0"
description = "ICT + ML Meta-Labeling Trading System for MNQ Futures"
authors = ["Bambam"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
h5py = "^3.11.0"
databento-dbn = "0.68.0"
zstandard = "0.25.0"
httpx = "^0.24.0"
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
websockets = "^12.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
apscheduler = "^3.10.0"
matplotlib = "^3.7.0"
streamlit = "^1.31.0"
plotly = "^5.18.0"
shap = "^0.45.0"
rich = "^13.7.0"
tenacity = "^8.2.0"

[tool.poetry.scripts]
check_yank_execution_pilot = "src.cli.check_yank_execution_pilot:main"
check-yank-native-minute = "src.cli.check_yank_native_minute:main"
validate-data = "src.cli.validate_data:main"
check_yank_bar_provenance = "src.cli.check_yank_bar_provenance:main"

# Offline research/validation only. NEVER imported from a live trading path.
#
# These are installed into a SEPARATE interpreter, /root/Silver-Bullet-ML-BMAD/.venv-research,
# NOT the .venv the live combine bots run on (trader-yank, trader-mim-nb, ...).
# Installing them into .venv would let pip re-resolve numpy/scipy/scikit-learn
# underneath running traders. Build the research venv with:
#
#   python3 -m venv /root/Silver-Bullet-ML-BMAD/.venv-research
#   /root/Silver-Bullet-ML-BMAD/.venv-research/bin/pip install arch skfolio statsmodels \
#       scikit-learn xgboost pandas numpy scipy pyarrow
#
# arch      -> Reality Check / Hansen SPA / Romano-Wolf StepM / MCS, block bootstraps
#              (multiple-testing correction over a family of strategy variants)
# skfolio   -> CombinatorialPurgedCV, WalkForward (purged/embargoed cross-validation)
# statsmodels -> multipletests: Benjamini-Hochberg FDR, Holm
#
# Deflated Sharpe is implemented in tools/validation/deflated_sharpe.py because
# neither arch nor skfolio ships it. Run its --self-test before relying on it.
[tool.poetry.group.research.dependencies]
arch = "^8.0.0"
skfolio = "^1.0.5"
statsmodels = "^0.15.0"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
pre-commit = "^3.3.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.0"
pytest-cov = "^4.1.0"
freezegun = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "src.data.config"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.websocket"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.transformation"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.ml.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.tradestation_auth"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.tradestation_client"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.tradestation_models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.futures_symbols"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.data.historical_downloader"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
