sl_multiplier: 2.0
tp_multiplier: 8.0
entry_pct: 0.5
atr_threshold: 0.5
max_gap_dollars: 60.0
max_hold_bars: 60
max_pending_bars: 240
contracts_per_trade: 5
max_daily_loss: -300.0  # sealed: preregistration_yank_daily_breaker_2ct.md (2ct-derived, 1.25x worst single trade)
vol_regime_lookback: 120
vol_regime_threshold: 0.75
