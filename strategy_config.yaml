                   # models/xgboost/tier2_threshold.json, set to 0.0 at the same time; this value is
                   # documentation — yank_streaming_working.py builds MetaLabelingFilter without it.
bearish_only: true
h1_sweep_lookback: 6
tuesday_exclusion: true
m15_confirmation: true
enable_kill_zone_filter: true
kill_zone_start_et: "09:30"
kill_zone_end_et: "11:00"
commission_per_roundtrip: 4.0
enable_ifvg_fallback: false
